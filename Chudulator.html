<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chudulator</title>

  <link rel="icon" type=".jpg" href="https://i.pinimg.com/736x/d5/41/df/d541dffdf186bbe6503231bc60d5e88d.jpg">
  
<style>
  @font-face{
    font-family: 'DSEG7';
    src: url('https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG7-Classic-Italic/DSEG7ClassicItalic-Bold.woff2') format('woff2'),
         url('https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG7-Classic-Italic/DSEG7ClassicItalic-Bold.woff') format('woff');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

  :root{
    --body-main: #4B4959;
    --body-main-light: #5B5769;
    --body-shadow: #2E2C38;
    --screen-bg: #D7DED2;
    --screen-bg-dark: #C4CDBC;
    --digit: #22261E;
    --digit-dim: rgba(34,38,30,0.16);
    --key-black: #1E1D24;
    --key-black-hi: #34323C;
    --key-red: #8B4A55;
    --key-red-hi: #A5606B;
    --key-white: #F4F2ED;
    --key-white-hi: #FFFFFF;
    --label-cream: #E8E4D8;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: radial-gradient(ellipse at 50% 0%, #6b6250 0%, #3f3a2e 65%, #2a271f 100%);
    font-family: 'Segoe UI', system-ui, sans-serif;
    padding: 24px;
  }

  .shell{
    width: 320px;
    background: linear-gradient(160deg, var(--body-main-light) 0%, var(--body-main) 55%, var(--body-shadow) 100%);
    border-radius: 14px 14px 26px 26px;
    padding: 22px 18px 26px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.15) inset,
      0 -10px 18px rgba(0,0,0,0.25) inset,
      0 18px 40px rgba(0,0,0,0.5);
    position: relative;
  }

  .shell::before{
    content:"";
    position:absolute;
    top:8px; left:8px; right:8px; bottom:8px;
    border-radius: 10px 10px 20px 20px;
    border: 1px solid rgba(255,255,255,0.08);
    pointer-events:none;
  }

  .brand-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding: 2px 6px 14px;
  }

  .brand{
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-weight: 800;
    font-size: 19px;
    letter-spacing: 0.5px;
    color: var(--label-cream);
    text-shadow: 0 1px 1px rgba(0,0,0,0.4);
  }

  .brand-sub{
    font-size: 9px;
    color: var(--label-cream);
    opacity: 0.55;
    letter-spacing: 1.5px;
  }

  .solar{
    display:flex;
    align-items:center;
    gap:4px;
  }
  .solar-cell{
    width:44px; height:14px;
    background: linear-gradient(135deg, #201f26, #0e0d12);
    border-radius:2px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.08) inset;
  }

  .screen-well{
    background: linear-gradient(160deg, #26242E, #34323d);
    border-radius: 8px;
    padding: 10px;
    box-shadow: 0 3px 6px rgba(0,0,0,0.4) inset;
    margin-bottom: 16px;
  }

  .screen{
    background: linear-gradient(170deg, var(--screen-bg) 0%, var(--screen-bg-dark) 100%);
    border-radius: 4px;
    padding: 14px 12px 10px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.35) inset;
    position: relative;
    overflow: hidden;
  }

  .screen::after{
    content:"";
    position:absolute;
    inset:0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0.05) 0px,
      rgba(0,0,0,0.05) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events:none;
    mix-blend-mode: multiply;
    opacity: 0.5;
  }

  .screen-topline{
    display:flex;
    justify-content: space-between;
    font-size: 9px;
    color: var(--digit);
    opacity: 0.65;
    letter-spacing: 1px;
    margin-bottom: 4px;
    font-family: 'Courier New', monospace;
  }

  .display-wrap{
    position: relative;
    min-height: 48px;
  }

  .display-ghost{
    position: absolute;
    inset: 0;
    font-family: 'DSEG7', 'Courier New', monospace;
    font-weight: 700;
    font-size: 40px;
    text-align: right;
    color: var(--digit-dim);
    letter-spacing: 1px;
    white-space: nowrap;
    line-height: 48px;
    pointer-events: none;
    user-select: none;
    z-index: 0;
  }

  .display{
    position: relative;
    z-index: 1;
    font-family: 'DSEG7', 'Courier New', monospace;
    font-weight: 700;
    font-size: 40px;
    text-align: right;
    color: var(--digit);
    text-shadow: 0 0 6px rgba(34,38,30,0.35);
    letter-spacing: 1px;
    white-space: nowrap;
    overflow: hidden;
    min-height: 48px;
    line-height: 48px;
  }

  .pad{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  button{
    border: none;
    font-family: inherit;
    font-weight: 700;
    font-size: 18px;
    color: var(--key-white);
    height: 52px;
    border-radius: 9px;
    cursor: pointer;
    position: relative;
    background: linear-gradient(180deg, var(--key-black-hi), var(--key-black));
    box-shadow:
      0 3px 0 #0a0a0d,
      0 5px 8px rgba(0,0,0,0.4);
    transition: transform 0.04s ease, box-shadow 0.04s ease;
  }

  button:active{
    transform: translateY(3px);
    box-shadow:
      0 0 0 #0a0a0d,
      0 2px 3px rgba(0,0,0,0.3);
  }

  button.num{
    background: linear-gradient(180deg, var(--key-black-hi), var(--key-black));
    color: var(--key-white-hi);
    box-shadow:
      0 3px 0 #0a0a0d,
      0 5px 8px rgba(0,0,0,0.35);
  }
  button.num:active{
    box-shadow: 0 0 0 #0a0a0d, 0 2px 3px rgba(0,0,0,0.25);
  }

  button.op{
    background: linear-gradient(180deg, #2A2933, #1B1A21);
    color: var(--key-white-hi);
    box-shadow:
      0 3px 0 #0a0a0d,
      0 5px 8px rgba(0,0,0,0.35);
  }
  button.op:active{
    box-shadow: 0 0 0 #0a0a0d, 0 2px 3px rgba(0,0,0,0.25);
  }

  button.clear{
    background: linear-gradient(180deg, var(--key-red-hi), var(--key-red));
    box-shadow:
      0 3px 0 #5c313a,
      0 5px 8px rgba(0,0,0,0.35);
  }
  button.clear:active{
    box-shadow: 0 0 0 #5c313a, 0 2px 3px rgba(0,0,0,0.25);
  }

  button.wide{
    grid-column: span 2;
  }

  .footer-label{
    text-align:center;
    margin-top: 14px;
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--label-cream);
    opacity: 0.4;
  }

  @media (prefers-reduced-motion: reduce){
    button{ transition: none; }
  }
</style>
</head>
<body>

<div class="shell">
  <div class="brand-row">
    <div>
      <div class="brand">CHUDULATOR</div>
      <div class="brand-sub">CX&#8209;100</div>
    </div>
    <div class="solar">
      <div class="solar-cell"></div>
    </div>
  </div>

  <div class="screen-well">
    <div class="screen">
      <div class="screen-topline"><span>DC</span><span>SOLAR</span></div>
      <div class="display-wrap">
        <div class="display-ghost">88888888888</div>
        <div class="display" id="display">0</div>
      </div>
    </div>
  </div>

  <div class="pad">
    <button class="clear" data-action="clear">AC</button>
    <button class="op" data-action="sign">+/&minus;</button>
    <button class="op" data-action="percent">%</button>
    <button class="op" data-action="divide">&divide;</button>

    <button class="num" data-num="7">7</button>
    <button class="num" data-num="8">8</button>
    <button class="num" data-num="9">9</button>
    <button class="op" data-action="multiply">&times;</button>

    <button class="num" data-num="4">4</button>
    <button class="num" data-num="5">5</button>
    <button class="num" data-num="6">6</button>
    <button class="op" data-action="subtract">&minus;</button>

    <button class="num" data-num="1">1</button>
    <button class="num" data-num="2">2</button>
    <button class="num" data-num="3">3</button>
    <button class="op" data-action="add">+</button>

    <button class="num wide" data-num="0">0</button>
    <button class="num" data-action="decimal">.</button>
    <button class="op" data-action="equals">=</button>
  </div>

  <div class="footer-label">MADE FOR NOSTALGIA &middot; 1998</div>
</div>

<script>
(function(){
  const display = document.getElementById('display');
  let current = '0';
  let previous = null;
  let operator = null;
  let overwrite = true;

  function updateDisplay(){
    let text = current;
    if(text.length > 11) text = parseFloat(text).toPrecision(9).toString();
    display.textContent = text;
  }

  function inputNumber(n){
    if(overwrite){
      current = n;
      overwrite = false;
    } else {
      if(current === '0') current = n;
      else current += n;
    }
    updateDisplay();
  }

  function inputDecimal(){
    if(overwrite){
      current = '0.';
      overwrite = false;
      updateDisplay();
      return;
    }
    if(!current.includes('.')) current += '.';
    updateDisplay();
  }

  function clearAll(){
    current = '0';
    previous = null;
    operator = null;
    overwrite = true;
    updateDisplay();
  }

  function toggleSign(){
    if(current === '0') return;
    current = current.startsWith('-') ? current.slice(1) : '-' + current;
    updateDisplay();
  }

  function percent(){
    current = (parseFloat(current) / 100).toString();
    updateDisplay();
  }

  function compute(a, b, op){
    a = parseFloat(a); b = parseFloat(b);
    switch(op){
      case 'add': return a + b;
      case 'subtract': return a - b;
      case 'multiply': return a * b;
      case 'divide': return b === 0 ? 0 : a / b;
      default: return b;
    }
  }

  function setOperator(op){
    if(operator && !overwrite){
      const result = compute(previous, current, operator);
      current = result.toString();
      updateDisplay();
    }
    previous = current;
    operator = op;
    overwrite = true;
  }

  function equals(){
    if(operator === null || previous === null) return;
    const result = compute(previous, current, operator);
    current = result.toString();
    previous = null;
    operator = null;
    overwrite = true;
    updateDisplay();
  }

  document.querySelectorAll('button[data-num]').forEach(btn=>{
    btn.addEventListener('click', ()=> inputNumber(btn.dataset.num));
  });

  document.querySelectorAll('button[data-action]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const action = btn.dataset.action;
      if(action === 'clear') clearAll();
      else if(action === 'sign') toggleSign();
      else if(action === 'percent') percent();
      else if(action === 'decimal') inputDecimal();
      else if(action === 'equals') equals();
      else setOperator(action);
    });
  });

  window.addEventListener('keydown', (e)=>{
    if(e.key >= '0' && e.key <= '9') inputNumber(e.key);
    else if(e.key === '.') inputDecimal();
    else if(e.key === '+') setOperator('add');
    else if(e.key === '-') setOperator('subtract');
    else if(e.key === '*') setOperator('multiply');
    else if(e.key === '/') setOperator('divide');
    else if(e.key === 'Enter' || e.key === '=') equals();
    else if(e.key === 'Escape') clearAll();
  });
})();
</script>

</body>
</html>
