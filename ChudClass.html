<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Hub</title>
    <style>
        :root {
            --bg-main: #0f172a; --bg-card: #1e293b; --text-main: #f8fafc;
            --accent: #38bdf8; --border: #334155;
        }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; }

        /* Login Overlay */
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center; z-index: 9999;
        }
        .login-card {
            background: rgba(30, 41, 59, 0.7); border: 1px solid var(--border);
            padding: 40px; border-radius: 24px; width: 320px; text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        .login-card h2 { margin-top: 0; }
        .login-card input { width: 100%; padding: 12px; margin: 15px 0; background: #0f172a; border: 1px solid var(--border); color: white; border-radius: 8px; box-sizing: border-box; }
        .login-card button { width: 100%; padding: 12px; background: var(--accent); border: none; border-radius: 8px; color: #000; font-weight: bold; cursor: pointer; }

        /* Sidebar & Content */
        .sidebar { width: 250px; background: #0f172a; border-right: 1px solid var(--border); padding: 20px; }
        .main-content { flex: 1; padding: 40px; }
        .card { background: var(--bg-card); padding: 20px; margin-bottom: 15px; border-radius: 12px; border: 1px solid var(--border); }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-card">
            <h2>Welcome</h2>
            <input type="text" id="uid" placeholder="Enter Student ID">
            <button id="loginBtn">Login</button>
        </div>
    </div>

    <div class="sidebar">
        <h3>Class Hub</h3>
        <button onclick="show('hw')">Assignments</button>
        <button onclick="show('chart')">Seating</button>
    </div>

    <div class="main-content">
        <div id="hw" class="view">
            <h1>Assignments</h1>
            <div id="hwList"></div>
        </div>
        <div id="chart" class="view" style="display:none">
            <h1>Seating Chart</h1>
            <img id="seatImg" style="width:100%; border-radius:12px;">
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // --- PASTE YOUR CONFIG HERE ---
 apiKey: "AIzaSyAtZ9TWRdg3zDgdoy64nJJtJvnSjcboW_w",
  authDomain: "chud-class-tracker.firebaseapp.com",
  databaseURL: "https://chud-class-tracker-default-rtdb.firebaseio.com",
  projectId: "chud-class-tracker",
  storageBucket: "chud-class-tracker.firebasestorage.app",
  messagingSenderId: "246585543754",
  appId: "1:246585543754:web:a26df56b7c018a6b612ab3"
        };

        const db = getDatabase(initializeApp(firebaseConfig));

        // Logic
        if(localStorage.getItem('user')) document.getElementById('loginOverlay').style.display = 'none';

        document.getElementById('loginBtn').onclick = () => {
            localStorage.setItem('user', document.getElementById('uid').value);
            location.reload();
        };

        window.show = (id) => {
            document.querySelectorAll('.view').forEach(v => v.style.display = 'none');
            document.getElementById(id).style.display = 'block';
        };

        onValue(ref(db, 'class_homework'), (s) => {
            const list = document.getElementById('hwList');
            list.innerHTML = '';
            Object.values(s.val() || {}).forEach(item => {
                list.insertAdjacentHTML('beforeend', `<div class="card"><h3>${item.subject}</h3><p>${item.task}</p></div>`);
            });
        });

        onValue(ref(db, 'sitting_layout'), (s) => {
            if(s.val()?.chart_url) document.getElementById('seatImg').src = s.val().chart_url;
        });
    </script>
</body>
</html>
