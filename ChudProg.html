<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Series Progression Hub</title>
    <link rel="icon" type="image/jpeg" href="https://i.pinimg.com/736x/b6/c7/21/b6c72133b1b9e7e71ddd08ec8cf1ba9e.jpg">
    <style>
        :root {
            --bg-main-start: #1e2022; --bg-main-end: #111215;
            --bg-card-start: #23272a; --bg-card-end: #1a1c1e;
            --border-color: #2f343d; --text-main: #f5f5f7;
            --text-muted: #9ea4b0; --success: #10b981; --warning: #f97316;
        }
        body { margin: 0; padding: 0; font-family: system-ui, sans-serif; background: linear-gradient(135deg, var(--bg-main-start) 0%, var(--bg-main-end) 100%); background-attachment: fixed; color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }
        .tracker-wrapper { width: 100%; max-width: 900px; padding: 40px 20px; box-sizing: border-box; }
        header { margin-bottom: 30px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; }
        .header-title-container { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
        .header-icon { width: 42px; height: 42px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border-color); }
        h1 { margin: 0; font-size: 2rem; letter-spacing: -0.025em; }
        .subtitle { color: var(--text-muted); margin: 0; font-size: 0.95rem; }
        .global-dev-card { display: flex; align-items: center; gap: 12px; background: linear-gradient(135deg, rgba(35, 39, 42, 0.4) 0%, rgba(26, 28, 30, 0.4) 100%); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 16px; width: fit-content; min-width: 260px; margin-top: 14px; backdrop-filter: blur(8px); }
        .global-dev-pfp { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-color); }
        .series-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: linear-gradient(145deg, var(--bg-card-start) 0%, var(--bg-card-end) 100%); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; position: relative; min-height: 160px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15); }
        .card-header-block { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
        .title { margin: 0; font-size: 1.2rem; color: var(--text-main); font-weight: 700; }
        .project-thumb { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border-color); }
        .description { color: var(--text-muted); font-size: 0.88rem; margin: 0 0 20px 0; line-height: 1.4; }
        .schedule-zone { font-size: 0.75rem; font-family: monospace; color: var(--text-muted); margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px dashed var(--border-color); }
        .schedule-tag { font-weight: 700; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; text-transform: uppercase; border: 1px solid; }
        .schedule-tag.ontime { color: var(--text-main); border-color: rgba(255, 255, 255, 0.15); }
        .schedule-tag.delayed { color: var(--warning); border-color: var(--warning); }
        .progress-track { width: 100%; height: 6px; background-color: rgba(0,0,0,0.2); border-radius: 4px; overflow: hidden; margin-top: 10px; }
        .progress-fill { height: 100%; background-color: var(--text-main); width: 0%; transition: width 0.4s ease; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "YOUR_REGENERATED_API_KEY",
            authDomain: "gen-lang-client-0801332051.firebaseapp.com",
            databaseURL: "https://gen-lang-client-0801332051-default-rtdb.firebaseio.com",
            projectId: "gen-lang-client-0801332051",
            storageBucket: "gen-lang-client-0801332051.firebasestorage.app",
            messagingSenderId: "665957195586",
            appId: "1:665957195586:web:293104b4e0f1393c5572db"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const today = new Date();

        onValue(ref(db, 'chud_series_projects'), (snapshot) => {
            const data = snapshot.val();
            const grid = document.getElementById('seriesGrid');
            grid.innerHTML = '';
            if (!data) return;

            Object.keys(data).forEach(id => {
                if (id === 'placeholder') return;
                const p = data[id];
                const progress = parseInt(p.progress || 0);
                const dueDate = new Date(p.estimated_release_date);

                // --- AUTO-DELAY ENGINE ---
                if (progress < 100 && today > dueDate && p.status !== "Delayed") {
                    let newDate = new Date(dueDate);
                    newDate.setDate(newDate.getDate() + 4);
                    update(ref(db, 'chud_series_projects/' + id), {
                        status: "Delayed",
                        schedule_status: "delayed",
                        estimated_release_date: newDate.toISOString().split('T')[0]
                    });
                }

                const isDelayed = (p.schedule_status === 'delayed' || p.status === 'Delayed');
                
                grid.insertAdjacentHTML('beforeend', `
                    <div class="card">
                        <div>
                            <div class="card-header-block">
                                <h3 class="title">${p.name}</h3>
                                ${p.img ? `<img class="project-thumb" src="${p.img}">` : ''}
                            </div>
                            <p class="description">${p.desc || 'No description.'}</p>
                            <div class="schedule-zone">
                                <div>START: ${p.startDate || 'N/A'}</div>
                                <div>DUE: ${p.estimated_release_date}</div>
                                <span class="schedule-tag ${isDelayed ? 'delayed' : 'ontime'}">
                                    ${isDelayed ? 'DELAYED' : 'ON TIME'}
                                </span>
                            </div>
                        </div>
                        <div class="progress-track"><div class="progress-fill" style="width: ${progress}%"></div></div>
                    </div>
                `);
            });
        });
    </script>
</head>
<body>
    <div class="tracker-wrapper">
        <header>
            <div class="header-title-container">
                <img class="header-icon" src="https://i.pinimg.com/736x/b6/c7/21/b6c72133b1b9e7e71ddd08ec8cf1ba9e.jpg">
                <h1>Series Progression Tracker</h1>
            </div>
            <p class="subtitle">Ecosystem deployment node map</p>
        </header>
        <div class="series-grid" id="seriesGrid"></div>
    </div>
</body>
</html>
