<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chud Call Experiment</title>
    <style>
        body {
            background-color: #111215;
            color: #f5f5f7;
            font-family: system-ui, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;
        }
        h2 { letter-spacing: -0.02em; margin-bottom: 5px; }
        .subtitle { color: #9ea4b0; font-size: 0.9rem; margin-bottom: 25px; font-family: monospace; }
        
        .video-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px; width: 100%; max-width: 800px; margin-bottom: 25px;
        }
        .video-box {
            position: relative; background-color: #23272a; border: 2px solid #2f343d;
            border-radius: 12px; overflow: hidden; aspect-ratio: 4/3;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        #localVideo { transform: scaleX(-1); } /* Mirror local feed */
        
        .label {
            position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.6);
            padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-family: monospace;
        }
        .controls { display: flex; gap: 15px; }
        button {
            padding: 12px 24px; font-weight: 600; border-radius: 8px; border: none;
            cursor: pointer; font-size: 0.9rem; transition: background 0.2s;
        }
        .host-btn { background-color: #10b981; color: white; }
        .guest-btn { background-color: #3b82f6; color: white; }
        button:disabled { background-color: #2f343d; color: #9ea4b0; cursor: not-allowed; }
    </style>
</head>
<body>

    <h2>Chud Call Live Node</h2>
    <div class="subtitle">// P2P WEBRTC SIGNALING EXPERIMENT</div>

    <div class="video-grid">
        <div class="video-box">
            <video id="localVideo" autoplay playsinline muted></video>
            <div class="label">LOCAL STREAM (YOU)</div>
        </div>
        <div class="video-box">
            <video id="remoteVideo" autoplay playsinline></video>
            <div class="label">REMOTE STREAM (PEER)</div>
        </div>
    </div>

    <div class="controls">
        <button id="hostBtn" class="host-btn">Start Call (Host)</button>
        <button id="guestBtn" class="guest-btn">Join Call (Guest)</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // ===================================================
        // PASTE YOUR EXACT FIREBASE CONFIG MAP HERE
        // ===================================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY_HERE", 
            authDomain: "gen-lang-client-0801332051.firebaseapp.com",
            databaseURL: "https://gen-lang-client-0801332051-default-rtdb.firebaseio.com",
            projectId: "gen-lang-client-0801332051",
            storageBucket: "gen-lang-client-0801332051.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID_HERE",
            appId: "YOUR_APP_ID_HERE"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const callRef = ref(db, 'vcall_session');

        // STUN servers help peers find each other through firewalls
        const servers = {
            iceServers: [{ urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }]
        };

        let localStream = null;
        let remoteStream = null;
        let peerConnection = null;

        const hostBtn = document.getElementById('hostBtn');
        const guestBtn = document.getElementById('guestBtn');

        // Step 1: Open Local Camera and Microphone
        async function initMedia() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
                remoteStream = new MediaStream();
                document.getElementById('remoteVideo').srcObject = remoteStream;
            } catch (e) {
                alert("Camera/Mic access denied or unavailable.");
                console.error(e);
            }
        }

        // Setup WebRTC connection routing tracks
        function setupPeerConnection() {
            peerConnection = new RTCPeerConnection(servers);

            // Push our local mic/cam tracks into the connection channel
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            // Pull incoming remote mic/cam tracks down to display them
            peerConnection.ontrack = (event) => {
                event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));
            };
        }

        // ===================================================
        // HOST LOGIC (Person 1)
        // ===================================================
        hostBtn.addEventListener('click', async () => {
            hostBtn.disabled = true;
            guestBtn.disabled = true;
            await initMedia();
            setupPeerConnection();

            // Clear any old call junk out of database session
            await remove(callRef);

            // Listen for connection candidates and post them to Firebase
            peerConnection.onicecandidate = (e) => {
                if (e.candidate) {
                    update(ref(db, 'vcall_session/hostCandidates'), { [Date.now()]: e.candidate.toJSON() });
                }
            };

            // Create connection offer handshake
            const offerDescription = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offerDescription);

            const offer = {
                sdp: offerDescription.sdp,
                type: offerDescription.type
            };

            await set(ref(db, 'vcall_session/offer'), offer);

            // Listen for Guest's answer response to finish the pipeline
            onValue(ref(db, 'vcall_session/answer'), async (snapshot) => {
                const answer = snapshot.val();
                if (answer && !peerConnection.currentRemoteDescription) {
                    const answerDescription = new RTCSessionDescription(answer);
                    await peerConnection.setRemoteDescription(answerDescription);
                }
            });

            // Listen for Guest network candidates
            onValue(ref(db, 'vcall_session/guestCandidates'), (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    Object.values(data).forEach(candidateData => {
                        peerConnection.addIceCandidate(new RTCIceCandidate(candidateData));
                    });
                }
            });
        });

        // ===================================================
        // GUEST LOGIC (Person 2)
        // ===================================================
        guestBtn.addEventListener('click', async () => {
            hostBtn.disabled = true;
            guestBtn.disabled = true;
            await initMedia();
            setupPeerConnection();

            // Listen for Host network candidates
            onValue(ref(db, 'vcall_session/hostCandidates'), (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    Object.values(data).forEach(candidateData => {
                        peerConnection.addIceCandidate(new RTCIceCandidate(candidateData));
                    });
                }
            });

            // Read connection offer handshake from the Host
            onValue(ref(db, 'vcall_session/offer'), async (snapshot) => {
                const offer = snapshot.val();
                if (offer && !peerConnection.currentRemoteDescription) {
                    // Answer the network candidates and link up
                    peerConnection.onicecandidate = (e) => {
                        if (e.candidate) {
                            update(ref(db, 'vcall_session/guestCandidates'), { [Date.now()]: e.candidate.toJSON() });
                        }
                    };

                    await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
                    
                    const answerDescription = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answerDescription);

                    const answer = {
                        sdp: answerDescription.sdp,
                        type: answerDescription.type
                    };

                    await set(ref(db, 'vcall_session/answer'), answer);
                }
            });
        });
    </script>
</body>
</html>
